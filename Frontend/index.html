<!-- Criação da página principal aonde tudo ficará exibido -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento Climático</title>
    <link rel="stylesheet" href="src/styles.css">

    <!-- usei o CDN do Chart.js para criação do gráfico de barras -->
    <script src='https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js'></script>
</head>
<body>
    <div class="container-dashboard">
        
        <h1 class="titulo-principal">Monitoramento do Histórico de Climas</h1>

        <div class="controles-dashboard">
            <div class="botoes-esquerda">
                <button id="btn-cadastrar-cidade" onclick="window.location.href='cadastro_cidade.html'">Cadastrar Nova Cidade</button>
                <button id="btn-nova-temp" onclick="window.location.href='cadastro_temperatura.html'">Registrar Temperatura</button>
            </div>

            <div class="listas-direita">
                <select id="select-cidade">
                    <option value="">Selecionar cidade</option>
                </select>
            </div>
        </div>

        <div class="quadro-dashboard">
            <h2 id="titulo-quadro">Selecione uma cidade</h2>
            <ul id="lista-historico">
                <li>Aguardando seleção...</li>
            </ul>
            <!-- Espaço reservado para o gráfico -->
            <canvas id="meuGrafico" style="display: none;"></canvas>
        </div>

    </div>

    <script>
        // Variável global para armazenar e controlar a instância do gráfico
        let chartInstancia = null;

        // Função responsável por desenhar o gráfico na tela
        function desenharGrafico(historico) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');

            // Se já existir um gráfico, ele é destruído para evitar sobreposição
            if (chartInstancia) {
                chartInstancia.destroy();
            }

            // Inverte o array para mostrar da data mais antiga para a mais nova (esquerda para direita)
            const historicoOrdenado = historico.slice().reverse();

            // Extração das datas formatadas para os labels (eixo X)
            const labels = historicoOrdenado.map(item => {
                const dataObjeto = new Date(item.data);
                return dataObjeto.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
            });

            // Extração das temperaturas para os dados (eixo Y)
            const dados = historicoOrdenado.map(item => item.temperatura);

            // Criação do novo gráfico de barras
            chartInstancia = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperatura °C',
                        data: dados,
                        backgroundColor: '#007bff'
                    }]
                }
            });
        }

        // Aguarda o carregamento total da página antes de executar o script
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1ª Requisição: Carregar as cidades no select
            fetch('http://127.0.0.1:5000/cidades')
                .then(res => res.json())
                .then(cidades => {
                    if (Array.isArray(cidades)) {
                        const select = document.getElementById('select-cidade');
                        cidades.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.id;
                            opt.textContent = c.nome;
                            select.appendChild(opt);
                        });
                    }
                })
                .catch(err => console.error('Erro ao buscar cidades:', err));

            // 2ª Requisição: Carregar o Ranking Inicial (Top 10)
            fetch('http://127.0.0.1:5000/ranking')
                .then(res => res.json())
                .then(ranking => {
                    if (Array.isArray(ranking) && ranking.length > 0) {
                        document.getElementById('titulo-quadro').textContent = 'Top 10 Cidades mais Quentes';
                        
                        const lista = document.getElementById('lista-historico');
                        lista.innerHTML = ''; 

                        ranking.forEach((item, index) => {
                            const li = document.createElement('li');
                            const dataObjeto = new Date(item.data);
                            const dataFinal = dataObjeto.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                            
                            // Remove as casas decimais arredondando para o inteiro mais próximo
                            const tempInteira = Math.round(item.max_temp);
                            
                            // Cria a bolinha com a cor correspondente à sua posição no ranking (index + 1)
                            li.innerHTML = `
                                <span class="bolinha-ranking ranking-${index + 1}"></span>
                                <span>${item.nome} - ${dataFinal} - Máxima de ${tempInteira}°C</span>
                            `;
                            lista.appendChild(li);
                        });
                    }
                })
                .catch(err => console.error('Erro ao buscar ranking:', err));

            // 3ª Parte: Adicionando Interatividade ao Select
            const selectCidade = document.getElementById('select-cidade');
            const tituloQuadro = document.getElementById('titulo-quadro');
            const listaHistorico = document.getElementById('lista-historico');

            selectCidade.addEventListener('change', () => {
                const idCidade = selectCidade.value;

                if (idCidade === "") {
                    // Modo Ranking: Esconde o gráfico e mostra a lista
                    document.getElementById("meuGrafico").style.display = "none";
                    listaHistorico.style.display = "block";
                    if(chartInstancia) chartInstancia.destroy();

                    tituloQuadro.textContent = 'Top 10 Cidades mais Quentes';
                    listaHistorico.innerHTML = '';

                    fetch('http://127.0.0.1:5000/ranking')
                        .then(res => res.json())
                        .then(ranking => {
                            if (Array.isArray(ranking)) {
                                ranking.forEach((item, index) => {
                                    const li = document.createElement('li');
                                    const dataObjeto = new Date(item.data);
                                    const dataFinal = dataObjeto.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                                    
                                    const tempInteira = Math.round(item.max_temp);

                                    li.innerHTML = `
                                        <span class="bolinha-ranking ranking-${index + 1}"></span>
                                        <span>${item.nome} - ${dataFinal} - Máxima de ${tempInteira}°C</span>
                                    `;
                                    listaHistorico.appendChild(li);
                                });
                            }
                        })
                        .catch(err => console.error('Erro ao buscar ranking:', err));

                } else {
                    // Modo Histórico: Esconde a lista e mostra o gráfico
                    const nomeCidade = selectCidade.options[selectCidade.selectedIndex].text;
                    tituloQuadro.textContent = `Histórico - ${nomeCidade}`;
                    listaHistorico.innerHTML = ''; // Limpa a lista
                    
                    listaHistorico.style.display = "none";
                    document.getElementById("meuGrafico").style.display = "block";

                    fetch(`http://127.0.0.1:5000/temperaturas/${idCidade}`)
                        .then(res => res.json())
                        .then(historico => {
                            if (Array.isArray(historico)) {
                                // Chama a função para desenhar o gráfico com os dados recebidos
                                desenharGrafico(historico);
                            }
                        })
                        .catch(err => console.error('Erro ao buscar histórico:', err));
                }
            });
        });
    </script>
</body>
</html>
